[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Laicai, a local-first agent workspace for models, skills, workflows, and Obsidian knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "rich>=13.0,<14",
  "prompt_toolkit>=3.0,<4",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.58,<2",
]
macos = [
  "pyinstaller>=6.0,<7",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
harness = "harness.cli.main:app"
laicai = "harness.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
