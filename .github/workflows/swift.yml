name: Swift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Install lint tools
        run: |
          brew list swift-format >/dev/null 2>&1 || brew install swift-format
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
      - name: Build package
        working-directory: native-macos
        run: swift build
      - name: Run tests
        working-directory: native-macos
        run: swift test
      - name: Check build script syntax
        run: bash -n native-macos/build.sh
      - name: Validate bundled skills
        run: python3 scripts/validate_skills.py
      - name: Check Swift file size budget
        run: bash scripts/check_swift_file_sizes.sh
      - name: Check project hygiene
        run: bash scripts/check_project_hygiene.sh
      - name: Swift lint
        run: bash scripts/lint_swift.sh
      - name: Check formatting whitespace
        run: git diff --check
