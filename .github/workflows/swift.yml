name: Swift

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check build script syntax
        run: |
          bash -n native-macos/build.sh
          bash -n native-macos/package-dmg.sh
      - name: Validate bundled skills
        run: python3 scripts/validate-skills.py
      - name: Check Swift file size budget
        run: bash scripts/check-swift-file-sizes.sh
      - name: Check project hygiene
        run: bash scripts/check-project-hygiene.sh
      - name: Swift lint debt report
        continue-on-error: true
        run: bash scripts/lint-swift.sh
      - name: Check formatting whitespace
        run: git diff --check

  swiftpm:
    runs-on: macos-14
    needs: hygiene
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Check macOS toolchain
        run: bash scripts/check-macos-toolchain.sh
      - name: Build package
        working-directory: native-macos
        run: swift build
      - name: Run tests
        working-directory: native-macos
        run: swift test
